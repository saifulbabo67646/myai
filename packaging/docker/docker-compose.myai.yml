# myai single-team deployment (docs/myai-plan.md §4.7; operator guide: docs/deployment.md).
#
# Topology — three processes, one published port:
#
#   host :8443 ──▶ tls-proxy  (profile `tls`, optional)   ─┐
#                                                          ├─ shared network namespace
#                  myai-server  127.0.0.1:8788  ◀───────────┘  (published port only)
#                       │
#                       └─▶ openwork-runtime  127.0.0.1:8787   (never published)
#
# The myai server refuses to boot in production unless it binds to loopback
# (apps/myai-server/src/config.ts), and it refuses any runtime URL that is not
# loopback. The runtime and the TLS proxy therefore join the myai-server
# network namespace instead of using a bridge network: `127.0.0.1` means the
# same thing to all three processes, and only the TLS proxy is reachable from
# outside. See docs/deployment.md § "Topology constraints" before changing it.
#
#   cp myai-server.env.example myai-server.env   # then edit it
#   docker compose --env-file myai-server.env -f docker-compose.myai.yml --profile tls up -d --build

name: myai

services:
  myai-server:
    image: ${MYAI_SERVER_IMAGE:-myai-server:local}
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.myai-server
      target: control-plane
    init: true
    restart: unless-stopped
    environment:
      MYAI_ENV: production
      # Loopback is mandatory in production; the check is in the server, not here.
      MYAI_HOST: 127.0.0.1
      MYAI_PORT: "8788"
      MYAI_DATA_DIR: /var/lib/myai/data
      MYAI_DATABASE_PATH: /var/lib/myai/data/control.sqlite
      MYAI_LOG_FILE: /var/lib/myai/data/myai-server.log
      MYAI_RUNTIME_BASE_URL: http://127.0.0.1:8787
      MYAI_WORKSPACE_ROOTS: /srv/myai/workspaces
      MYAI_PUBLIC_BASE_URL: ${MYAI_PUBLIC_BASE_URL:?set MYAI_PUBLIC_BASE_URL in the env file}
      MYAI_SESSION_SECRET: ${MYAI_SESSION_SECRET:?set MYAI_SESSION_SECRET in the env file}
      MYAI_BOOTSTRAP_SECRET: ${MYAI_BOOTSTRAP_SECRET:?set MYAI_BOOTSTRAP_SECRET in the env file}
    volumes:
      # The one persistent control-data volume: control database, log file.
      - myai-control-data:/var/lib/myai/data
      # Workspace storage, shared with the runtime. Owned by uid 10001.
      - ${MYAI_WORKSPACE_HOST_PATH:-./workspaces}:/srv/myai/workspaces
    ports:
      # Served by the `tls` profile; nothing listens here when it is off.
      - "${MYAI_EDGE_BIND:-127.0.0.1}:${MYAI_EDGE_PORT:-8443}:8443"
    healthcheck:
      # Readiness, not liveness: green only when configuration, the control
      # database, and the loopback runtime are all usable.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.MYAI_PORT||'8788')+'/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  openwork-runtime:
    image: ${MYAI_RUNTIME_IMAGE:-myai-runtime:local}
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.myai-server
      target: runtime
    init: true
    restart: unless-stopped
    # Same namespace as the control plane: the runtime stays on loopback and is
    # never reachable from the host or from any other container.
    network_mode: "service:myai-server"
    depends_on:
      myai-server:
        condition: service_started
    command:
      - bun
      - dist/cli.js
      - --host
      - 127.0.0.1
      - --port
      - "8787"
      - --workspace
      - /srv/myai/workspaces
      - --no-log-requests
    volumes:
      - ${MYAI_WORKSPACE_HOST_PATH:-./workspaces}:/srv/myai/workspaces

  tls-proxy:
    # Neutral TLS termination. Bring your own image with MYAI_TLS_PROXY_IMAGE.
    image: ${MYAI_TLS_PROXY_IMAGE:-nginx:1.29-alpine}
    profiles: ["tls"]
    restart: unless-stopped
    network_mode: "service:myai-server"
    depends_on:
      myai-server:
        condition: service_started
    configs:
      - source: myai_tls_config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      # PEM certificate and key, for example from certbot or your internal CA.
      - ${MYAI_TLS_CERT_DIR:-./tls}:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

configs:
  myai_tls_config:
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        ''      close;
      }
      server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 64m;
        # Streaming runtime responses must not be buffered.
        proxy_buffering off;
        location / {
          proxy_pass http://127.0.0.1:8788;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_read_timeout 300s;
        }
      }

volumes:
  myai-control-data:
